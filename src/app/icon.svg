<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Whetstone: the grit scale itself. Four strokes, each finer than the last,
       reading 120 through 8000 left to right. The mark is the product's one idea.
       Paper ground, ink strokes, and the finest stroke in the mark colour, which
       is the same rule the rest of the product follows. -->
  <rect width="32" height="32" rx="3" fill="#f6f0e4"/>
  <g stroke="#17120c" stroke-linecap="square">
    <line x1="6"  y1="24" x2="13" y2="8" stroke-width="3.5"/>
    <line x1="13" y1="24" x2="20" y2="8" stroke-width="2.25"/>
    <line x1="19" y1="24" x2="26" y2="8" stroke-width="1.25"/>
  </g>
  <line x1="24.5" y1="24" x2="31.5" y2="8" stroke="#a32d14" stroke-width="0.9" stroke-linecap="square"/>
</svg>
